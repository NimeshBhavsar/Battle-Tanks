[project]
name = "tankbattle"
version = "0.1.0"
description = "A local-network, turn-based tank artillery game built with Pygame."
readme = "README.md"
authors = [
    { name = "Nimesh Bhavsar", email = "nimeshbhavsar006@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "pygame>=2.6",
]

[project.scripts]
tankbattle = "tankbattle:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D"]
ignore = [
    "D203", "D213",  # pick the D211/D212 styles instead
    "D107",  # the class docstring documents __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # test names describe themselves
"docs/*" = ["D", "E402"]  # the screenshot script sets env vars before importing pygame

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
